[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chainrules"
version = "0.1.0"
description = "A minimal, AD-system-agnostic JVP/VJP rule interface for scientific Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MatrixLab contributors" }]
keywords = ["automatic-differentiation", "chainrules", "scientific-computing", "jvp", "vjp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.16.1",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]
docs = [
  "mkdocs-material==9.6.15",
  "mkdocstrings[python]==0.29.1",
  "mkdocstrings-python==1.16.12",
]

[project.urls]
Documentation = "https://git.gewu-lab.ai/kun-agent/chainrules/-/blob/main/docs/index.md"
Repository = "https://git.gewu-lab.ai/kun-agent/chainrules"
Issues = "https://git.gewu-lab.ai/kun-agent/chainrules/-/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chainrules"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C4",
  "C90",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "I",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=chainrules",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chainrules"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
